<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rhythm Game - Beatmap Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root {
            --color-1: #00f2ff; --color-2: #ff2a6d; --color-3: #4aff2a;
            --color-4: #fff200; --bg-color: #121212; --fretboard-bg: #282828;
        }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center;
            align-items: center; height: 100vh; background-color: var(--bg-color);
            font-family: 'Orbitron', sans-serif; color: #fff; overflow: hidden;
            touch-action: manipulation;
        }
        .game-container {
            position: relative; width: 100%; max-width: 500px; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between;
        }
        .game-header {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 20px; box-sizing: border-box;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }
        .note-count-display { font-size: 1.5rem; font-weight: 700; text-shadow: 0 0 10px #fff; }
        .pause-button {
            font-size: 2rem; font-weight: bold; cursor: pointer; width: 40px;
            height: 40px; display: flex; justify-content: center; align-items: center;
            border: 2px solid white; border-radius: 50%; transition: all 0.2s ease;
        }
        .pause-button:hover { background-color: white; color: var(--bg-color); }
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--fretboard-bg); border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .hit-keys-display {
            display: flex; width: 100%; justify-content: space-around;
            padding: 10px 0; position: absolute; top: 72%; z-index: 5;
            pointer-events: none;
        }
        .key {
            width: 60px; height: 60px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 1.8rem;
            font-weight: bold; border: 3px solid; transition: all 0.05s ease;
        }
        .key.key-1 { border-color: var(--color-1); color: var(--color-1); }
        .key.key-2 { border-color: var(--color-2); color: var(--color-2); }
        .key.key-3 { border-color: var(--color-3); color: var(--color-3); }
        .key.key-4 { border-color: var(--color-4); color: var(--color-4); }
        .key.active { transform: scale(1.1); box-shadow: 0 0 20px, inset 0 0 10px; }
        .message-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .message-overlay h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .message-overlay p { font-size: 1.2rem; margin-bottom: 20px; max-width: 90%; }
        .message-overlay button, .message-overlay input {
            padding: 15px 30px; font-size: 1.2rem; font-family: 'Orbitron', sans-serif;
            background-color: var(--color-2); color: white; border: none;
            border-radius: 10px; cursor: pointer; text-transform: uppercase;
            transition: background-color 0.2s; box-shadow: 0 0 15px var(--color-2);
            margin-top: 10px;
        }
        .message-overlay input[type="number"] {
            width: 80%;
            max-width: 300px;
            text-align: center;
            -moz-appearance: textfield;
        }
        .message-overlay input::-webkit-outer-spin-button,
        .message-overlay input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        .message-overlay button:hover { background-color: #ff5a8d; }
        .message-overlay button:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
        .difficulty-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .difficulty-selector button { font-size: 1rem; padding: 10px 20px; background-color: #444; }
        .difficulty-selector button.active { background-color: var(--color-3); box-shadow: 0 0 15px var(--color-3); }
        .touch-targets {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 35%; display: flex; z-index: 4;
        }
        .touch-lane { flex-grow: 1; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="note-count-display">Notes: 0</div>
            <div class="pause-button" id="pauseButton" style="display: none;">||</div>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <div class="hit-keys-display">
            <div class="key key-1" id="key-display-0">A</div>
            <div class="key key-2" id="key-display-1">S</div>
            <div class="key key-3" id="key-display-2">K</div>
            <div class="key key-4" id="key-display-3">L</div>
        </div>
        
        <div class="touch-targets">
            <div class="touch-lane" data-lane="0"></div>
            <div class="touch-lane" data-lane="1"></div>
            <div class="touch-lane" data-lane="2"></div>
            <div class="touch-lane" data-lane="3"></div>
        </div>

        <div class="message-overlay" id="startScreen">
            <h1>Beatmap Creator</h1>
            <p>Upload a song, enter its BPM, then play along to create a new beatmap.</p>
            
            <input type="file" id="songUploader" accept="audio/*">
            <input type="number" id="bpmInput" placeholder="Enter Song BPM">
            
            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="Easy">Easy</button>
                <button class="difficulty-btn active" data-difficulty="Normal">Normal</button>
                <button class="difficulty-btn" data-difficulty="Hard">Hard</button>
            </div>

            <button id="startButton" disabled>Start Creating</button>
        </div>

        <div class="message-overlay" id="resultsScreen" style="display: none;">
            <h1>Download Complete!</h1>
            <p>Your quantized beatmap has been downloaded as a JSON file.</p>
            <button id="mainMenuButton">Create Another</button>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const noteCountDisplay = document.querySelector('.note-count-display');
        const startScreen = document.getElementById('startScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const startButton = document.getElementById('startButton');
        const mainMenuButton = document.getElementById('mainMenuButton');
        const pauseButton = document.getElementById('pauseButton');
        const songUploader = document.getElementById('songUploader');
        const bpmInput = document.getElementById('bpmInput');
        const difficultyButtons = document.querySelectorAll('.difficulty-btn');
        const touchLanes = document.querySelectorAll('.touch-lane');
        const keyDisplays = [
            document.getElementById('key-display-0'),
            document.getElementById('key-display-1'),
            document.getElementById('key-display-2'),
            document.getElementById('key-display-3'),
        ];

        // --- Game Configuration ---
        const NUM_LANES = 4;
        const NOTE_COLORS = ['#00f2ff', '#ff2a6d', '#4aff2a', '#fff200'];
        const KEY_MAPPINGS = {'a': 0, 's': 1, 'k': 2, 'l': 3};
        const HIT_LINE_Y_POSITION = 0.70;
        const GAME_SPEED = 1.0; 
        const SONG_START_DELAY = 2.0; 
        let laneWidth;
        let noteHeight;
        
        // --- Game State ---
        let notes = [];
        let recordedBeatmap = [];
        let gameMode = 'menu'; 
        let isPaused = false;
        let animationFrameId;
        let audioPlayer = null;
        let audioBlobUrl = null; 
        let currentDifficulty = 'Normal';
        let masterClock = 0;
        let lastFrameTime = 0;

        // --- Sizing and Responsiveness ---
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            laneWidth = canvas.width / NUM_LANES;
            noteHeight = laneWidth * 0.5;
        }

        // --- Game Initialization for Creator ---
        function initCreator() {
            if (!audioBlobUrl) {
                alert("Please select a song first.");
                return;
            }
             const bpm = parseFloat(bpmInput.value);
            if (!bpm || bpm <= 0) {
                alert("Please enter a valid BPM.");
                return;
            }

            audioPlayer = new Audio(audioBlobUrl);
            audioPlayer.addEventListener('ended', generateBeatmapFile);

            resizeCanvas();
            notes = [];
            recordedBeatmap = [];
            gameMode = 'creating';
            isPaused = false;
            updateNoteCountDisplay();
            startScreen.style.display = 'none';
            pauseButton.style.display = 'flex';
            
            audioPlayer.currentTime = 0;
            setTimeout(() => {
                if (gameMode === 'creating' && !isPaused) audioPlayer.play();
            }, SONG_START_DELAY * 1000);
            
            masterClock = -SONG_START_DELAY;
            lastFrameTime = performance.now();
            gameLoop();
        }
        
        // --- Game Loop ---
        function gameLoop() {
            if (gameMode !== 'creating' || isPaused) return;
            
            const now = performance.now();
            const deltaTime = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            
            masterClock += deltaTime;
            if (audioPlayer && audioPlayer.played.length > 0) {
                masterClock = audioPlayer.currentTime;
            }
            const elapsedTime = masterClock;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFretboard();
            drawHitLine();
            handleNotes(elapsedTime);
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Drawing Functions ---
        function drawFretboard() {
            for (let i = 1; i < NUM_LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.stroke();
            }
        }

        function drawHitLine() {
            const hitLineY = canvas.height * HIT_LINE_Y_POSITION;
            ctx.lineWidth = 5;
            for (let i = 0; i < NUM_LANES; i++) {
                ctx.strokeStyle = NOTE_COLORS[i];
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, hitLineY);
                ctx.lineTo((i + 1) * laneWidth, hitLineY);
                ctx.stroke();
            }
            ctx.lineWidth = 1; 
        }

        function drawNote(note) {
            ctx.fillStyle = note.color;
            ctx.shadowColor = note.color;
            ctx.shadowBlur = 15;
            const x = note.lane * laneWidth;
            ctx.beginPath();
            ctx.roundRect(x + laneWidth * 0.1, note.y - (noteHeight / 2), laneWidth * 0.8, noteHeight, [10]);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // --- Note Handling for Creator ---
        function handleNotes(elapsedTime) {
            const pixelsPerSecond = canvas.height / GAME_SPEED;
            const hitLineY = canvas.height * HIT_LINE_Y_POSITION;

            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                const timeToHit = note.hitTime - elapsedTime;
                const distanceFromHitLine = timeToHit * pixelsPerSecond;
                note.y = hitLineY - distanceFromHitLine;

                if (note.y > canvas.height + noteHeight) {
                    notes.splice(i, 1); // Remove notes that have gone off-screen
                } else if (note.y > -noteHeight) {
                    drawNote(note);
                }
            }
        }
        
        // --- Player Input and Recording ---
        function handleKeyPress(e) {
            if (gameMode !== 'creating' || isPaused) return;
            const key = e.key.toLowerCase();
            if (key in KEY_MAPPINGS) {
                const lane = KEY_MAPPINGS[key];
                recordHit(lane);
            }
        }
        
        function animateKey(lane) {
            const keyDisplay = keyDisplays[lane];
            keyDisplay.classList.add('active');
            setTimeout(() => keyDisplay.classList.remove('active'), 100);
        }

        function recordHit(lane) {
            if (!audioPlayer || audioPlayer.paused) return;
            
            const hitTime = audioPlayer.currentTime;
            
            recordedBeatmap.push({ lane: lane, time: hitTime });
            
            notes.push({ lane: lane, hitTime: hitTime, y: 0, color: NOTE_COLORS[lane] });

            updateNoteCountDisplay();
            animateKey(lane);
        }

        function updateNoteCountDisplay() {
            noteCountDisplay.textContent = `Notes: ${recordedBeatmap.length}`;
        }

        // --- Quantization and File Generation ---
        function quantizeBeatmap(beatmap, bpm) {
            const beatDuration = 60 / bpm;
            const quantizationStep = beatDuration / 4; // Quantize to 1/16th notes
            const quantizedMap = [];
            const addedTimestamps = new Set();

            beatmap.forEach(note => {
                const quantizedTime = Math.round(note.time / quantizationStep) * quantizationStep;
                const roundedTime = parseFloat(quantizedTime.toFixed(4));
                
                // Prevent multiple notes from snapping to the exact same timestamp in the same lane
                const key = `${roundedTime}-${note.lane}`;
                if (!addedTimestamps.has(key)) {
                    quantizedMap.push({ lane: note.lane, time: roundedTime });
                    addedTimestamps.add(key);
                }
            });

            // Sort by time, as quantization might change the order slightly
            return quantizedMap.sort((a,b) => a.time - b.time);
        }

        function downloadJson(data, filename) {
            const jsonString = JSON.stringify(data, null, 4);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function generateBeatmapFile() {
            gameMode = 'menu';
            if (audioPlayer) audioPlayer.pause();
            cancelAnimationFrame(animationFrameId);

            const bpm = parseFloat(bpmInput.value);
            if (!bpm || bpm <= 0) {
                alert("Invalid BPM. Could not generate beatmap.");
                goToMainMenu();
                return;
            }

            const quantizedNotes = quantizeBeatmap(recordedBeatmap, bpm);

            const resultObject = {
                [currentDifficulty]: quantizedNotes
            };
            
            downloadJson(resultObject, 'beatmap.json');

            resultsScreen.style.display = 'flex';
            pauseButton.style.display = 'none';
        }
        
        function goToMainMenu() {
            gameMode = 'menu';
            isPaused = false;
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.removeEventListener('ended', generateBeatmapFile);
                audioPlayer = null;
            }
            if(audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
            audioBlobUrl = null;

            cancelAnimationFrame(animationFrameId);
            
            resultsScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            pauseButton.style.display = 'none';
            songUploader.value = '';
            bpmInput.value = '';
            startButton.disabled = true;
            recordedBeatmap = [];
            updateNoteCountDisplay();
        }
        
        // --- Event Listeners ---
        function checkInputs() {
            const hasFile = songUploader.files.length > 0;
            const hasBpm = bpmInput.value && parseFloat(bpmInput.value) > 0;
            startButton.disabled = !(hasFile && hasBpm);
        }

        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('keydown', handleKeyPress);
        songUploader.addEventListener('change', checkInputs);
        bpmInput.addEventListener('input', checkInputs);

        difficultyButtons.forEach(button => {
            button.addEventListener('click', () => {
                difficultyButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentDifficulty = button.dataset.difficulty;
            });
        });

        startButton.addEventListener('click', () => {
             if (Tone.context.state !== 'running') {
                Tone.start();
            }
            initCreator();
        });
        
        mainMenuButton.addEventListener('click', goToMainMenu);
        
        touchLanes.forEach(laneElement => {
            const lane = parseInt(laneElement.dataset.lane, 10);
            const handleTap = (event) => {
                event.preventDefault();
                if (gameMode !== 'creating' || isPaused) return;
                recordHit(lane);
            };
            laneElement.addEventListener('mousedown', handleTap);
            laneElement.addEventListener('touchstart', handleTap);
        });

        // --- Initial Setup ---
        window.onload = () => {
            resizeCanvas();
            drawFretboard();
            drawHitLine();
        };
    </script>
</body>
</html>
